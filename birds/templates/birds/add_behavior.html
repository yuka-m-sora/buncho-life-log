{% extends 'birds/base.html' %}

{% block title %}
行動記録追加
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <h2>📝 {{ bird.name }}の行動を記録</h2>
        <p>その日の様子や気になった行動を記録できます。</p>
    </div>

    <div class="record-form-card">

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label for="{{ form.date.id_for_label }}" class="form-label">
                    📅 日付
                </label>
                {{ form.date }}
            </div>

            <div class="mb-4">
                <label for="{{ form.category.id_for_label }}" class="form-label">
                    🏷️ カテゴリ
                </label>
                {{ form.category }}
            </div>

            <div class="mb-4">
                <label for="{{ form.memo.id_for_label }}" class="form-label">
                    📝 メモ
                </label>
                {{ form.memo }}
            </div>

            <button type="submit" class="record-submit-btn">
                保存する
            </button>

        </form>

    </div>

    <a href="{% url 'bird_detail' bird.id %}" class="form-back-link">
        ← {{ bird.name }}の記録に戻る
    </a>

</div>

{% endblock %}
