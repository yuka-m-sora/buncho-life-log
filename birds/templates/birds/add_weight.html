{% extends 'birds/base.html' %}

{% block title %}
体重記録追加
{% endblock %}

{% block content %}
    <h1>{{ bird.name }}の体重追加</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">保存</button>
    </form>

    <p>
        <a href="{% url 'bird_detail' bird.id %}">戻る</a>
    </p>
{% endblock %}
