{% extends 'birds/base.html' %}

{% block title %}
行動記録削除
{% endblock %}

{% block content %}

<h2>行動記録を削除しますか？</h2>

<p>{{ behavior.date }}</p>
<p>{{ behavior.category }}</p>
<p>{{ behavior.memo }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">
        削除する
    </button>
</form>

<p>
    <a href="{% url 'bird_detail' bird.id %}">
        戻る
    </a>
</p>

{% endblock %}
