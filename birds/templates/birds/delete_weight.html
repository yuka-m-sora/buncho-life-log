{% extends 'birds/base.html' %}

{% block title %}
体重記録削除
{% endblock %}

{% block content %}
    <h1>体重記録を削除しますか？</h1>

    <p>
        {{ weight_record.date }}：
        {{ weight_record.weight|floatformat:1 }}g
        {% if weight_record.memo %}
            （{{ weight_record.memo }}）
        {% endif %}
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">削除する</button>
    </form>

    <p>
        <a href="{% url 'bird_detail' bird.id %}">戻る</a>
    </p>
{% endblock %}
