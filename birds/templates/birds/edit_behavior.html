{% extends 'birds/base.html' %}

{% block title %}
行動記録編集
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <h2>✏️ {{ bird.name }}の行動記録を編集</h2>
        <p>記録した内容を修正できます。</p>
    </div>

    <div class="record-form-card">

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-4">
                <label for="{{ form.date.id_for_label }}" class="form-label">
                    📅 日付
                </label>
                {{ form.date }}
            </div>

            <div class="mb-4">
                <label for="{{ form.category.id_for_label }}" class="form-label">
                    🏷️ カテゴリ
                </label>
                {{ form.category }}
            </div>

            <div class="mb-4">
                <label for="{{ form.memo.id_for_label }}" class="form-label">
                    📝 メモ
                </label>
                {{ form.memo }}
            </div>

            <div class="mb-4">
                <label for="{{ form.photo.id_for_label }}" class="form-label">
                    📷 写真
                </label>
                {{ form.photo }}
            </div>

            <button type="submit" class="record-submit-btn">
                更新する
            </button>

        </form>

    </div>

    <a href="{% url 'bird_detail' bird.id %}" class="form-back-link">
        ← {{ bird.name }}の記録に戻る
    </a>

</div>

{% endblock %}
