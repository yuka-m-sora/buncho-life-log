{% extends 'birds/base.html' %}

{% block title %}
体重記録編集
{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <h2>⚖️ {{ bird.name }}の体重記録を編集</h2>
        <p>登録済みの体重やメモを修正できます。</p>
    </div>

    <div class="record-form-card">

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label for="{{ form.date.id_for_label }}" class="form-label">
                    📅 日付
                </label>
                {{ form.date }}
            </div>

            <div class="mb-4">
                <label for="{{ form.weight.id_for_label }}" class="form-label">
                    ⚖️ 体重（g）
                </label>
                {{ form.weight }}
            </div>

            <div class="mb-4">
                <label for="{{ form.memo.id_for_label }}" class="form-label">
                    📝 メモ
                </label>
                {{ form.memo }}
            </div>

            <button type="submit" class="record-submit-btn">
                更新する
            </button>

        </form>

    </div>

    <a href="{% url 'bird_detail' bird.id %}" class="form-back-link">
        ← {{ bird.name }}の記録に戻る
    </a>

</div>

{% endblock %}
